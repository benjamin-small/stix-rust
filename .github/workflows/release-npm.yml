name: release-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: bindings/typescript-node } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: bindings/typescript-node/package-lock.json }
      - run: npm ci
      - run: npx napi build --platform --release --target ${{ matrix.target }} --js binding.js --dts binding.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: bindings/typescript-node/*.node
  node-publish:
    needs: node-build
    runs-on: ubuntu-latest
    # npm trusted publishing: the job authenticates with a short-lived OIDC token,
    # so no NPM_TOKEN secret is needed (or read).
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: bindings/typescript-node } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Node 24 ships npm 11; trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: bindings/typescript-node/package-lock.json }
      - run: npm --version
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: bindings/typescript-node/artifacts
          merge-multiple: false
      # Scoped packages default to private; make every publish in this job public
      # (napi prepublish publishes the platform sub-packages itself, without --access)
      - run: npm config set access public
      # Generate the npm/<platform>/ sub-package scaffolding napi artifacts expects
      - run: npx napi create-npm-dir -t .
      - run: npx napi artifacts
      - run: npx napi build --platform --js binding.js --dts binding.d.ts && npx tsc
      # Smoke-test the packed artifact: the loader must actually ship
      - name: Verify tarball contents
        run: |
          tarball=$(npm pack --silent)
          tar -tzf "$tarball" | grep -q "package/binding.js" || { echo "binding.js missing from tarball"; exit 1; }
          tar -tzf "$tarball" | grep -q "package/dist/index.js" || { echo "dist missing from tarball"; exit 1; }
          rm "$tarball"
      - run: npx napi prepublish -t npm --skip-gh-release
      - name: Publish (skip if version already live)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view @stix-rust/node version 2>/dev/null)" = "$VERSION" ]; then
            echo "@stix-rust/node@$VERSION already published — skipping"
          else
            npm publish --access public
          fi
  wasm-publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: bindings/typescript-wasm } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: bindings/typescript-wasm/package-lock.json }
      - run: npm --version
      - run: cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run build
      # Smoke-test the packed artifact: wasm-pack's pkg/.gitignore must not exclude pkg/
      - name: Verify tarball contents
        run: |
          tarball=$(npm pack --silent)
          tar -tzf "$tarball" | grep -q "package/pkg/stix_wasm.js" || { echo "pkg/ missing from tarball"; exit 1; }
          tar -tzf "$tarball" | grep -q "package/dist/index.js" || { echo "dist missing from tarball"; exit 1; }
          rm "$tarball"
      - name: Publish (skip if version already live)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view @stix-rust/wasm version 2>/dev/null)" = "$VERSION" ]; then
            echo "@stix-rust/wasm@$VERSION already published — skipping"
          else
            npm publish --access public
          fi
